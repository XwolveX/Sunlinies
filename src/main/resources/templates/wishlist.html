<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{layout/base :: head('Yêu thích')}"></head>

    <body>
        <style>
            :root {
                --mainColor: #c8986a; --darkColor: #3d2e1c;
                --borderColor: #e8e4de; --bgLight: #faf2e6;
                --muted: #7a6a57; --fontDisplay: 'Playfair Display', serif;
                --fontBody: 'Lato', sans-serif; --transition: 0.3s ease;
            }

            /* ── BREADCRUMB ─────────────────────── */
            .wl-bc {
                padding: 14px 0;
                border-bottom: 1px solid var(--borderColor);
                font-size: 12px; color: #aaa;
            }
            .wl-bc a { color: #aaa; transition: color var(--transition); }
            .wl-bc a:hover { color: var(--mainColor); }
            .wl-bc__sep { margin: 0 8px; color: #ddd; }

            /* ── PAGE ───────────────────────────── */
            .wl-page { padding: 52px 0 100px; min-height: 60vh; }

            .wl-header {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                margin-bottom: 36px;
                flex-wrap: wrap;
                gap: 12px;
            }
            .wl-title {
                font-family: var(--fontDisplay);
                font-size: clamp(24px, 3vw, 36px);
                font-weight: 400;
                color: var(--darkColor);
            }
            .wl-count {
                font-size: 13px;
                color: var(--muted);
                margin-left: 10px;
            }
            .wl-btn-clear {
                font-size: 11px; font-weight: 700;
                letter-spacing: 1.5px; text-transform: uppercase;
                color: #bbb; background: none; border: none;
                cursor: pointer; font-family: var(--fontBody);
                transition: color var(--transition);
                text-decoration: underline;
            }
            .wl-btn-clear:hover { color: #e74c3c; }

            /* ── GRID ───────────────────────────── */
            .wl-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }

            /* ── CARD ───────────────────────────── */
            .wl-card {
                position: relative;
                opacity: 0;
                transform: translateY(16px);
                transition: opacity .4s ease, transform .4s ease;
            }
            .wl-card.is-visible { opacity: 1; transform: translateY(0); }
            .wl-card:hover { transform: translateY(-4px); }

            .wl-card__thumb {
                position: relative;
                border-radius: 10px;
                overflow: hidden;
                aspect-ratio: 3/4;
                background: #f5f5f5;
                margin-bottom: 12px;
            }
            .wl-card__thumb img {
                width: 100%; height: 100%;
                object-fit: cover;
                transition: transform .6s cubic-bezier(.25,.46,.45,.94);
            }
            .wl-card:hover .wl-card__thumb img { transform: scale(1.06); }

            /* Remove btn */
            .wl-card__remove {
                position: absolute; top: 10px; right: 10px; z-index: 3;
                width: 30px; height: 30px;
                background: rgba(255,255,255,.9); backdrop-filter: blur(4px);
                border: none; border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                cursor: pointer; color: #999;
                transition: all var(--transition);
                box-shadow: 0 2px 8px rgba(0,0,0,.1);
            }
            .wl-card__remove:hover { background: #e74c3c; color: #fff; }
            .wl-card__remove svg { width: 14px; height: 14px; }

            /* Add to cart overlay */
            .wl-card__actions {
                position: absolute; bottom: 0; left: 0; right: 0;
                padding: 12px;
                transform: translateY(100%); opacity: 0;
                transition: all .35s cubic-bezier(.25,.46,.45,.94);
                background: linear-gradient(to top, rgba(0,0,0,.45), transparent);
            }
            .wl-card:hover .wl-card__actions { transform: translateY(0); opacity: 1; }
            .wl-card__btn-cart {
                width: 100%;
                padding: 11px;
                background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
                border: none; border-radius: 6px;
                font-size: 11px; font-weight: 700;
                letter-spacing: 1.5px; text-transform: uppercase;
                cursor: pointer; color: var(--darkColor);
                font-family: var(--fontBody);
                transition: background var(--transition), color var(--transition);
            }
            .wl-card__btn-cart:hover { background: var(--darkColor); color: #fff; }

            /* Badge */
            .wl-card__badge {
                position: absolute; top: 10px; left: 10px; z-index: 2;
                font-size: 10px; font-weight: 700;
                padding: 3px 9px; border-radius: 20px;
            }
            .wl-card__badge--sale { background: #e74c3c; color: #fff; }
            .wl-card__badge--new  { background: var(--darkColor); color: var(--bgLight); }

            /* Info */
            .wl-card__name {
                font-size: 14px; font-weight: 600;
                color: var(--darkColor); margin-bottom: 5px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            }
            .wl-card__name a:hover { color: var(--mainColor); }
            .wl-card__price { display: flex; align-items: center; gap: 7px; }
            .wl-card__price-cur { font-size: 14px; font-weight: 700; color: var(--mainColor); }
            .wl-card__price-cur.is-sale { color: #e74c3c; }
            .wl-card__price-old { font-size: 12px; color: #bbb; text-decoration: line-through; }

            /* ── EMPTY STATE ────────────────────── */
            .wl-empty {
                text-align: center;
                padding: 80px 0 60px;
            }
            .wl-empty__icon {
                width: 80px; height: 80px;
                margin: 0 auto 24px;
                background: var(--bgLight);
                border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                color: var(--mainColor);
            }
            .wl-empty__icon svg { width: 36px; height: 36px; }
            .wl-empty__title {
                font-family: var(--fontDisplay);
                font-size: 24px; font-weight: 400;
                color: var(--darkColor); margin-bottom: 10px;
            }
            .wl-empty__desc {
                font-size: 14px; color: var(--muted);
                margin-bottom: 28px; line-height: 1.7;
            }
            .wl-empty__btn {
                display: inline-block;
                padding: 14px 36px;
                background: var(--darkColor); color: var(--bgLight);
                font-size: 12px; font-weight: 700;
                letter-spacing: 2px; text-transform: uppercase;
                border-radius: 4px; transition: background var(--transition);
                text-decoration: none;
            }
            .wl-empty__btn:hover { background: var(--mainColor); }

            /* ── RESPONSIVE ─────────────────────── */
            @media (max-width: 992px) { .wl-grid { grid-template-columns: repeat(3, 1fr); } }
            @media (max-width: 640px) { .wl-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
        </style>

        <div th:replace="~{fragments/header :: header}"></div>

        <!-- Breadcrumb -->
        <div class="wl-bc">
            <div class="container">
                <a th:href="@{/static}">Trang chủ</a>
                <span class="wl-bc__sep">›</span>
                <span style="color:var(--darkColor);font-weight:600;">Yêu thích</span>
            </div>
        </div>

        <main class="wl-page">
            <div class="container">

                <!-- Header -->
                <div class="wl-header">
                    <div>
                        <span class="wl-title">Sản phẩm yêu thích</span>
                        <span class="wl-count" id="wlCount"></span>
                    </div>
                    <button class="wl-btn-clear" id="btnClearAll" style="display:none;">
                        Xoá tất cả
                    </button>
                </div>

                <!-- Empty state -->
                <div class="wl-empty" id="wlEmpty" style="display:none;">
                    <div class="wl-empty__icon">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.3">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682
                             a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318
                             a4.5 4.5 0 00-6.364 0z"/>
                        </svg>
                    </div>
                    <div class="wl-empty__title">Chưa có sản phẩm yêu thích</div>
                    <div class="wl-empty__desc">
                        Nhấn vào biểu tượng tim trên sản phẩm để lưu lại<br>những món đồ bạn yêu thích.
                    </div>
                    <a href="/collections" class="wl-empty__btn">Khám phá sản phẩm</a>
                </div>

                <!-- Grid -->
                <div class="wl-grid" id="wlGrid"></div>

            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>

        <!-- Cart Drawer -->
        <div class="cart-overlay" id="cartOverlay"></div>
        <div class="cart-drawer" id="cartDrawer">
            <div class="cart-drawer-head">
                <h3>Giỏ hàng (<span id="cartItemCount">0</span>)</h3>
                <button class="cart-close" id="btnCartClose">×</button>
            </div>
            <div class="cart-items" id="cartItemsList">
                <div class="cart-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                    <p>Giỏ hàng của bạn đang trống</p>
                </div>
            </div>
            <div class="cart-footer" id="cartFooter" style="display:none;">
                <div class="cart-total-row"><span>Tổng tiền</span><span id="cartTotal">0đ</span></div>
                <a href="/cart" class="btn-checkout">Tiến hành thanh toán</a>
            </div>
        </div>

        <button class="back-to-top" id="backToTop">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
            </svg>
        </button>

        <script th:src="@{/js/index.js}"></script>
        <script>
            /* ============================================================
               WISHLIST PAGE – đọc/ghi localStorage
               Key: 'sunilies_wishlist'
               Mỗi item: { id, handle, name, image, price, comparePrice, onSale, isNew }
               ============================================================ */

            const WL_KEY = 'sunilies_wishlist';

            function getWishlist() {
                try { return JSON.parse(localStorage.getItem(WL_KEY)) || []; }
                catch { return []; }
            }
            function saveWishlist(items) {
                localStorage.setItem(WL_KEY, JSON.stringify(items));
                updateBadge(items.length);
            }
            function updateBadge(n) {
                document.querySelectorAll('.js-wishlist-count').forEach(el => el.textContent = n || '');
            }

            function formatPrice(n) {
                return new Intl.NumberFormat('vi-VN').format(n) + 'đ';
            }

            function removeItem(id) {
                const items = getWishlist().filter(p => p.id !== id);
                saveWishlist(items);
                render(items);
            }

            function addToCart(item) {
                fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        productId: item.id,
                        handle: item.handle,
                        name: item.name,
                        image: item.image,
                        price: item.price,
                        comparePrice: item.comparePrice,
                        qty: 1
                    })
                })
                    .then(r => r.json())
                    .then(data => {
                        const count = document.getElementById('cartItemCount');
                        if (count) count.textContent = data.totalQty || data.count || 0;
                        /* mở drawer nếu có */
                        document.getElementById('cartDrawer')?.classList.add('active');
                        document.getElementById('cartOverlay')?.classList.add('active');
                    })
                    .catch(() => alert('Không thể thêm vào giỏ hàng'));
            }

            function render(items) {
                const grid    = document.getElementById('wlGrid');
                const empty   = document.getElementById('wlEmpty');
                const count   = document.getElementById('wlCount');
                const btnClear= document.getElementById('btnClearAll');

                count.textContent  = items.length ? `(${items.length} sản phẩm)` : '';
                btnClear.style.display = items.length ? 'inline' : 'none';

                if (!items.length) {
                    grid.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';

                grid.innerHTML = items.map((p, i) => `
        <div class="wl-card" data-id="${p.id}" style="transition-delay:${i * 60}ms">
            <div class="wl-card__thumb">
                ${p.onSale  ? `<span class="wl-card__badge wl-card__badge--sale">-${Math.round((1 - p.price / p.comparePrice) * 100)}%</span>` : ''}
                ${p.isNew   ? `<span class="wl-card__badge wl-card__badge--new">Mới</span>` : ''}

                <a href="/products/${p.handle}">
                    <img src="${p.image || '/image/placeholder.jpg'}" alt="${p.name}" loading="lazy" />
                </a>

                <button class="wl-card__remove" onclick="removeItem('${p.id}')" title="Xoá khỏi yêu thích">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>

                <div class="wl-card__actions">
                    <button class="wl-card__btn-cart" onclick='addToCart(${JSON.stringify(p)})'>
                        Thêm vào giỏ hàng
                    </button>
                </div>
            </div>

            <div class="wl-card__name">
                <a href="/products/${p.handle}">${p.name}</a>
            </div>
            <div class="wl-card__price">
                <span class="wl-card__price-cur ${p.onSale ? 'is-sale' : ''}">${formatPrice(p.price)}</span>
                ${p.comparePrice && p.comparePrice > p.price
                    ? `<span class="wl-card__price-old">${formatPrice(p.comparePrice)}</span>` : ''}
            </div>
        </div>
    `).join('');

                /* Animate in */
                requestAnimationFrame(() => {
                    grid.querySelectorAll('.wl-card').forEach(card => {
                        card.classList.add('is-visible');
                    });
                });
            }

            /* Init */
            document.addEventListener('DOMContentLoaded', () => {
                const items = getWishlist();
                updateBadge(items.length);
                render(items);

                document.getElementById('btnClearAll').addEventListener('click', () => {
                    if (confirm('Xoá toàn bộ sản phẩm yêu thích?')) {
                        saveWishlist([]);
                        render([]);
                    }
                });
            });
        </script>

    </body>
</html>
