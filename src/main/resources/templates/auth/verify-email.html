<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Xác minh Email')}"></head>
<body>
<style>
    :root{--mainColor:#c8986a;--darkColor:#3d2e1c;--borderColor:#e8e4de;--bgLight:#faf2e6;--muted:#7a6a57;}
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bgLight);padding:40px 16px;}
    .auth-card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(61,46,28,.12);width:100%;max-width:420px;overflow:hidden;}
    .auth-card__header{background:var(--darkColor);padding:28px;text-align:center;}
    .auth-logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;color:var(--bgLight);letter-spacing:6px;}
    .auth-logo__sub{font-size:10px;letter-spacing:3px;color:var(--mainColor);text-transform:uppercase;margin-top:4px;}
    .auth-card__body{padding:36px;}
    .auth-icon{font-size:48px;text-align:center;margin-bottom:16px;}
    .auth-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;color:var(--darkColor);margin-bottom:8px;text-align:center;}
    .auth-sub{font-size:13px;color:var(--muted);margin-bottom:28px;text-align:center;line-height:1.7;}
    .auth-sub strong{color:var(--darkColor);}
    .auth-alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;}
    .auth-alert--error{background:#fff0ee;color:#c0392b;border:1px solid #fdb7b0;}
    .auth-alert--success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
    /* OTP inputs */
    .otp-group{display:flex;gap:10px;justify-content:center;margin-bottom:24px;}
    .otp-input{width:52px;height:58px;border:2px solid var(--borderColor);border-radius:12px;font-size:24px;font-weight:700;text-align:center;color:var(--darkColor);outline:none;transition:border-color .2s;font-family:'Lato',sans-serif;}
    .otp-input:focus{border-color:var(--mainColor);}
    .otp-input.filled{border-color:var(--mainColor);background:var(--bgLight);}
    /* Hidden real input */
    .otp-hidden{display:none;}
    .auth-btn{width:100%;padding:14px;background:var(--darkColor);color:var(--bgLight);border:none;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Lato',sans-serif;transition:background .3s;}
    .auth-btn:hover{background:var(--mainColor);}
    .auth-btn:disabled{opacity:.6;cursor:not-allowed;}
    .auth-resend{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
    .auth-resend a{color:var(--mainColor);font-weight:600;cursor:pointer;}
    .auth-timer{color:var(--muted);font-size:13px;}
    /* Dev OTP box */
    .dev-otp{background:#fff8e1;border:1px dashed #f39c12;border-radius:8px;padding:12px;text-align:center;margin-bottom:16px;font-size:12px;color:#e67e22;}
    .dev-otp strong{font-size:20px;letter-spacing:6px;color:#e67e22;display:block;margin-top:4px;}
</style>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-logo">SUNILIES</div>
            <div class="auth-logo__sub">Xác minh tài khoản</div>
        </div>
        <div class="auth-card__body">
            <div class="auth-icon">📧</div>
            <h1 class="auth-title">Kiểm tra email của bạn</h1>
            <p class="auth-sub">
                Chúng tôi đã gửi mã OTP 6 chữ số đến<br>
                <strong th:text="${email != null} ? ${email} : 'email của bạn'">email@example.com</strong>
            </p>

            <div th:if="${error}" class="auth-alert auth-alert--error" th:text="${error}">Lỗi</div>
            <div th:if="${success}" class="auth-alert auth-alert--success" th:text="${success}">OK</div>

            <form th:action="@{/verify-email}" method="post" id="verifyForm">
                <input type="hidden" name="email" th:value="${email}" id="hiddenEmail" />
                <input type="hidden" name="otp" id="hiddenOtp" />

                <!-- OTP boxes UI -->
                <div class="otp-group" id="otpGroup">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric" />
                </div>

                <button type="submit" class="auth-btn" id="verifyBtn" disabled>
                    Xác minh tài khoản
                </button>
            </form>

            <div class="auth-resend">
                <span id="timerWrap">Gửi lại sau <span id="countdown" class="auth-timer">10:00</span></span>
                <span id="resendWrap" style="display:none;">
                    Không nhận được? <a onclick="resendOtp()">Gửi lại OTP</a>
                </span>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    // ── OTP input UX ──────────────────────────────────────────
    var inputs = document.querySelectorAll('.otp-input');
    var hiddenOtp = document.getElementById('hiddenOtp');
    var verifyBtn = document.getElementById('verifyBtn');

    inputs.forEach(function(input, i) {
        input.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            if (this.value && i < inputs.length - 1) inputs[i + 1].focus();
            updateOtp();
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && i > 0) {
                inputs[i - 1].focus();
                inputs[i - 1].value = '';
                updateOtp();
            }
        });
        input.addEventListener('paste', function(e) {
            var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
            paste.split('').forEach(function(ch, idx) {
                if (inputs[idx]) inputs[idx].value = ch;
            });
            updateOtp();
            inputs[Math.min(paste.length, inputs.length - 1)].focus();
            e.preventDefault();
        });
    });

    function updateOtp() {
        var val = Array.from(inputs).map(function(i){ return i.value; }).join('');
        hiddenOtp.value = val;
        verifyBtn.disabled = val.length < 6;
        inputs.forEach(function(inp){ inp.classList.toggle('filled', inp.value !== ''); });
    }

    // ── Countdown timer ───────────────────────────────────────
    var seconds = 600; // 10 phút
    var timer = setInterval(function() {
        seconds--;
        var m = Math.floor(seconds / 60), s = seconds % 60;
        document.getElementById('countdown').textContent =
            (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        if (seconds <= 0) {
            clearInterval(timer);
            document.getElementById('timerWrap').style.display = 'none';
            document.getElementById('resendWrap').style.display = 'inline';
        }
    }, 1000);

    function resendOtp() {
        var email = document.getElementById('hiddenEmail').value;
        if (!email) return alert('Không tìm thấy email.');
        window.location.href = '/register?resend=' + encodeURIComponent(email);
    }

    document.getElementById('verifyForm').addEventListener('submit', function() {
        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Đang xác minh...';
    });
</script>
</body>
</html>
