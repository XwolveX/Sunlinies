<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Đăng nhập')}"></head>
<body>
<style>
    :root{--mainColor:#c8986a;--darkColor:#3d2e1c;--borderColor:#e8e4de;--bgLight:#faf2e6;--muted:#7a6a57;}
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bgLight);padding:40px 16px;}
    .auth-card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(61,46,28,.12);width:100%;max-width:440px;overflow:hidden;}
    .auth-card__header{background:var(--darkColor);padding:32px;text-align:center;}
    .auth-logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;color:var(--bgLight);letter-spacing:6px;}
    .auth-logo__sub{font-size:10px;letter-spacing:3px;color:var(--mainColor);text-transform:uppercase;margin-top:4px;}
    .auth-card__body{padding:36px 36px 28px;}
    .auth-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;color:var(--darkColor);margin-bottom:6px;}
    .auth-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
    .auth-alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:20px;display:flex;align-items:flex-start;gap:10px;}
    .auth-alert--error{background:#fff0ee;color:#c0392b;border:1px solid #fdb7b0;}
    .auth-alert--success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
    .auth-field{margin-bottom:18px;}
    .auth-label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--darkColor);margin-bottom:8px;}
    .auth-input{width:100%;padding:12px 16px;border:1.5px solid var(--borderColor);border-radius:10px;font-size:14px;font-family:'Lato',sans-serif;color:var(--darkColor);outline:none;transition:border-color .2s;box-sizing:border-box;}
    .auth-input:focus{border-color:var(--mainColor);}
    .auth-input-wrap{position:relative;}
    .auth-input-wrap .auth-input{padding-right:44px;}
    .auth-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#bbb;padding:0;}
    .auth-btn{width:100%;padding:14px;background:var(--darkColor);color:var(--bgLight);border:none;border-radius:10px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Lato',sans-serif;transition:background .3s;margin-top:8px;}
    .auth-btn:hover{background:var(--mainColor);}
    .auth-btn:disabled{opacity:.6;cursor:not-allowed;}
    .auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:12px;color:#ccc;}
    .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#e8e4de;}
    .auth-footer{text-align:center;font-size:13px;color:var(--muted);padding:20px 36px 28px;}
    .auth-footer a{color:var(--mainColor);font-weight:600;}
    .auth-footer a:hover{text-decoration:underline;}
    .auth-forgot{text-align:right;margin-top:-12px;margin-bottom:20px;}
    .auth-forgot a{font-size:12px;color:var(--mainColor);}
</style>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-logo">SUNILIES</div>
            <div class="auth-logo__sub">Handmade &amp; Artisan</div>
        </div>
        <div class="auth-card__body">
            <h1 class="auth-title">Đăng nhập</h1>
            <p class="auth-sub">Chào mừng trở lại!</p>

            <!-- Alert -->
            <div th:if="${error}" class="auth-alert auth-alert--error">
                <span>⚠️</span>
                <span th:text="${error}">Lỗi</span>
            </div>
            <div th:if="${param.logout}" class="auth-alert auth-alert--success">
                <span>✅</span>
                <span>Đăng xuất thành công.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="redirect" th:value="${redirect}" />

                <div class="auth-field">
                    <label class="auth-label">Email</label>
                    <input class="auth-input" type="email" name="email"
                           th:value="${email}" placeholder="your@email.com" required autofocus />
                </div>

                <div class="auth-field">
                    <label class="auth-label">Mật khẩu</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input" type="password" name="password"
                               id="loginPwd" placeholder="••••••••" required />
                        <button type="button" class="auth-eye" onclick="togglePwd('loginPwd',this)">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="auth-forgot">
                    <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn">Đăng nhập</button>
            </form>
        </div>

        <div class="auth-footer">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    function togglePwd(id, btn) {
        var input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.style.color = input.type === 'text' ? '#c8986a' : '#bbb';
    }
    document.querySelector('form').addEventListener('submit', function() {
        document.getElementById('loginBtn').disabled = true;
        document.getElementById('loginBtn').textContent = 'Đang đăng nhập...';
    });
</script>
</body>
</html>
